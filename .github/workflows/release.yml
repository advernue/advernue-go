name: release
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Build source archive
        run: git archive --format=tar.gz --prefix="advernue-go-${GITHUB_REF_NAME}/" -o "advernue-go-${GITHUB_REF_NAME}.tar.gz" "${GITHUB_REF_NAME}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: advernue-go-${{ github.ref_name }}.tar.gz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "advernue-go-${GITHUB_REF_NAME}.tar.gz" --generate-notes --verify-tag
